<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="description" content="Log in to 3G wifi clan.">
 <meta name="theme-color" content="#232527">
 <title>Log In - Roblox</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

 <style>
 * { box-sizing: border-box; margin: 0; padding: 0; }
 
 body {
   font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
   background: #000;
   min-height: 100vh;
   position: relative;
   overflow-x: hidden;
   display: flex;
   flex-direction: column;
   -webkit-font-smoothing: antialiased;
 }

 /* --- NEW BACKGROUND STYLES --- */
 .page-bg {
   position: fixed;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   z-index: 0;
   background: url('https://i.pinimg.com/originals/ec/1f/d8/ec1fd890f9a29d9746f0e32ab75e72c5.png') no-repeat center center fixed;
   background-size: cover;
 }

 .page-overlay {
   position: fixed;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   z-index: 1;
   background: rgba(0, 0, 0, 0.65); /* Darkens the image for readability */
 }

 /* Ensure content sits on top of the background */
 .top-nav, 
 main.auth-wrap {
   position: relative;
   z-index: 2;
 }

 /* --- EXISTING STYLES (Preserved) --- */
 .page {
   /* Used as a wrapper if needed, but body handles the layout now */
   min-height: 100vh;
 }

 .page a { text-decoration: none; color: inherit; }

 .top-nav {
   position: relative;
   z-index: 2;
   height: 52px;
   background: #232527;
   display: flex;
   align-items: center;
   gap: 28px;
   padding: 0 16px;
   border-bottom: 1px solid #3b3d40;
 }

 .roblox-logo {
   display: flex;
   align-items: center;
   justify-content: center;
 }

 .roblox-logo svg {
   height: 22px;
   width: 22px;
   fill: #ffffff;
   transition: opacity 0.15s ease;
 }

 .roblox-logo:hover svg { opacity: 0.85; }

 .nav-links {
   display: flex;
   align-items: center;
   gap: 44px;
 }

 .nav-link {
   font-size: 16px;
   font-weight: 600;
   color: #fff;
 }

 .nav-link:hover { opacity: 0.85; }

 .nav-search {
   position: relative;
   flex: 1;
   max-width: 630px;
 }

 .nav-search svg {
   position: absolute;
   left: 15px;
   top: 50%;
   transform: translateY(-50%);
   width: 18px;
   height: 18px;
   stroke: #e6e7e8;
   fill: none;
   stroke-width: 2;
   pointer-events: none;
 }

 .nav-search input {
   width: 100%;
   height: 38px;
   background: #1b1c1e;
   border: 1px solid #3b3d40;
   border-radius: 8px;
   padding: 0 14px 0 44px;
   font-size: 15px;
   color: #fff;
   outline: none;
   font-family: inherit;
 }

 .nav-search input::placeholder { color: #e6e7e8; opacity: 1; }
 .nav-search input:focus { border-color: #3973f2; }

 .auth-wrap {
   flex: 1;
   display: flex;
   align-items: center;
   justify-content: center;
   padding: 20px;
 }

 .auth-card {
   background: #232527;
   border-radius: 12px;
   padding: 32px;
   width: 100%;
   max-width: 400px;
   box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
   border: 1px solid #3b3d40;
 }

 .auth-title {
   font-size: 24px;
   font-weight: 700;
   color: #fff;
   margin-bottom: 24px;
   text-align: center;
 }

 .input-group {
   margin-bottom: 16px;
 }

 .input-group label {
   display: block;
   font-size: 14px;
   font-weight: 600;
   color: #e6e7e8;
   margin-bottom: 8px;
 }

 .input-group input {
   width: 100%;
   height: 40px;
   background: #1b1c1e;
   border: 1px solid #3b3d40;
   border-radius: 8px;
   padding: 0 12px;
   font-size: 15px;
   color: #fff;
   font-family: inherit;
   outline: none;
 }

 .input-group input:focus { border-color: #3973f2; }

 .btn-primary {
   width: 100%;
   height: 40px;
   background: #fff;
   border: none;
   border-radius: 8px;
   font-size: 16px;
   font-weight: 700;
   color: #000;
   cursor: pointer;
   margin-top: 8px;
   transition: background 0.15s ease;
 }

 .btn-primary:hover { background: #e6e7e8; }

 .forgot-password {
   display: block;
   text-align: center;
   font-size: 14px;
   color: #3973f2;
   margin-top: 16px;
   text-decoration: underline;
 }

 .footer-text {
   text-align: center;
   font-size: 14px;
   color: #e6e7e8;
   margin-top: 24px;
 }

 .footer-text a {
   color: #3973f2;
   text-decoration: underline;
 }

 /* Mobile Adjustments */
 @media (max-width: 768px) {
   .nav-links { display: none; }
   .nav-search { max-width: 100%; }
   .auth-card { padding: 24px; }
 }
 </style>
</head>
<body>

 <!-- Background Layers -->
 <div class="page-bg"></div>
 <div class="page-overlay"></div>

 <!-- Navigation -->
 <header class="top-nav">
   <a href="#" class="roblox-logo">
     <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5.5 2h13a3.5 3.5 0 0 1 3.5 3.5v13A3.5 3.5 0 0 1 18.5 22h-13A3.5 3.5 0 0 1 2 18.5v-13A3.5 3.5 0 0 1 5.5 2zm0 2a1.5 1.5 0 0 0-1.5 1.5v13a1.5 1.5 0 0 0 1.5 1.5h13a1.5 1.5 0 0 0 1.5-1.5v-13A1.5 1.5 0 0 0 18.5 4h-13zM8 7h2v2H8V7zm0 4h2v2H8v-2zm0 4h2v2H8v-2zm4-8h2v2h-2V7zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2zm4-8h2v2h-2V7zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2z"/></svg>
   </a>
   
   <nav class="nav-links">
     <a href="#" class="nav-link">Discover</a>
     <a href="#" class="nav-link">Marketplace</a>
     <a href="#" class="nav-link">Create</a>
     <a href="#" class="nav-link">Robux</a>
   </nav>

   <div class="nav-search">
     <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
     <input type="text" placeholder="Search">
   </div>
 </header>

 <!-- Login Form -->
 <main class="auth-wrap">
   <div class="auth-card">
     <h1 class="auth-title">Log In</h1>
     
     <form id="loginForm">
       <div class="input-group">
         <label for="username">Username or email</label>
         <input type="text" id="username" autocomplete="username">
       </div>
       
       <div class="input-group">
         <label for="password">Password</label>
         <input type="password" id="password" autocomplete="current-password">
       </div>
       
       <button type="submit" class="btn-primary">Log In</button>
       
       <a href="#" class="forgot-password">Forgot password?</a>
     </form>

     <p class="footer-text">
       Don't have an account? <a href="#">Sign Up</a>
     </p>
   </div>
 </main>

 <script>
 // Simple form handling example
 document.getElementById('loginForm').addEventListener('submit', function(e) {
   e.preventDefault();
   const user = document.getElementById('username').value;
   const pass = document.getElementById('password').value;
   console.log(`Attempting login for: ${user}`);
   // Add your actual login logic here
 });
 </script>

</body>
</html>
