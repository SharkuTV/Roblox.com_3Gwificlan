<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Add account - Roblox</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

 <style>
 * { box-sizing: border-box; margin: 0; padding: 0; }
 body {
   font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
   background: #000;
   min-height: 100vh;
   position: relative;
   overflow-x: hidden;
   display: flex;
   flex-direction: column;
   -webkit-font-smoothing: antialiased;
 }

 /* --- BACKGROUND COLLAGE (Replicating the Screenshot) --- */
 .bg-collage {
   position: fixed;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   z-index: 0;
   display: grid;
   grid-template-columns: repeat(8, 1fr);
   gap: 12px;
   padding: 20px;
   transform: rotate(-5deg) scale(1.1);
   transform-origin: center;
   opacity: 0.6;
   pointer-events: none;
 }

 .bg-tile {
   aspect-ratio: 1 / 1;
   background-size: cover;
   background-position: center;
   border-radius: 12px;
   box-shadow: 0 4px 10px rgba(0,0,0,0.5);
   position: relative;
   overflow: hidden;
 }

 /* Dark overlay to ensure text readability */
 .bg-overlay {
   position: fixed;
   inset: 0;
   background: rgba(0, 0, 0, 0.4);
   z-index: 1;
   pointer-events: none;
 }

 /* --- NAVBAR (Matching Screenshot) --- */
 .top-nav {
   position: relative;
   z-index: 10;
   height: 52px;
   background: #232527;
   display: flex;
   align-items: center;
   padding: 0 16px;
   border-bottom: 1px solid #3b3d40;
 }

 .nav-left {
   display: flex;
   align-items: center;
   gap: 24px;
 }

 .roblox-logo svg {
   height: 22px;
   width: 22px;
   fill: #fff;
 }

 .nav-links {
   display: flex;
   gap: 24px;
 }

 .nav-link {
   font-size: 15px;
   font-weight: 600;
   color: #e6e7e8;
   text-decoration: none;
 }

 .nav-link:hover { color: #fff; }

 .nav-right {
   margin-left: auto;
   display: flex;
   align-items: center;
   gap: 16px;
 }

 .btn-signup {
   background: #fff;
   color: #000;
   padding: 6px 16px;
   border-radius: 8px;
   font-weight: 700;
   font-size: 14px;
   text-decoration: none;
 }

 /* --- LOGIN CARD (Matching Screenshot) --- */
 .auth-wrap {
   flex: 1;
   display: flex;
   align-items: center;
   justify-content: center;
   padding: 40px 20px;
   z-index: 10;
 }

 .auth-card {
   background: #232527;
   border-radius: 12px;
   padding: 32px;
   width: 100%;
   max-width: 400px;
   box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
   border: 1px solid #3b3d40;
 }

 .auth-title {
   font-size: 24px;
   font-weight: 700;
   color: #fff;
   margin-bottom: 24px;
   text-align: center;
 }

 .input-group {
   margin-bottom: 16px;
 }

 .input-group label {
   display: block;
   font-size: 14px;
   font-weight: 600;
   color: #e6e7e8;
   margin-bottom: 8px;
 }

 .input-group input {
   width: 100%;
   height: 40px;
   background: #1b1c1e;
   border: 1px solid #3b3d40;
   border-radius: 8px;
   padding: 0 12px;
   font-size: 15px;
   color: #fff;
   outline: none;
 }

 .input-group input:focus { border-color: #3973f2; }

 .btn-primary {
   width: 100%;
   height: 40px;
   background: #fff;
   border: none;
   border-radius: 8px;
   font-size: 16px;
   font-weight: 700;
   color: #000;
   cursor: pointer;
   margin-top: 8px;
 }

 .btn-primary:hover { background: #e6e7e8; }

 .forgot-password {
   display: block;
   text-align: center;
   font-size: 14px;
   color: #3973f2;
   margin-top: 16px;
   text-decoration: underline;
 }

 /* Social Buttons */
 .social-buttons {
   display: flex;
   gap: 12px;
   margin-top: 16px;
 }

 .btn-social {
   flex: 1;
   height: 40px;
   background: #1b1c1e;
   border: 1px solid #3b3d40;
   border-radius: 8px;
   color: #fff;
   font-size: 14px;
   font-weight: 600;
   cursor: pointer;
   display: flex;
   align-items: center;
   justify-content: center;
   gap: 8px;
 }

 .btn-social:hover { background: #2a2c30; }

 .divider {
   display: flex;
   align-items: center;
   margin: 24px 0;
   color: #8a8c90;
   font-size: 14px;
 }

 .divider::before, .divider::after {
   content: '';
   flex: 1;
   height: 1px;
   background: #3b3d40;
 }

 .divider span {
   padding: 0 12px;
 }

 .footer-text {
   text-align: center;
   font-size: 14px;
   color: #e6e7e8;
   margin-top: 24px;
 }

 .footer-text a {
   color: #3973f2;
   text-decoration: underline;
 }

 /* Mobile Adjustments */
 @media (max-width: 768px) {
   .nav-links { display: none; }
   .nav-search { display: none; }
   .auth-card { padding: 24px; }
 }
 </style>
</head>

 <div class="bg-collage" id="collage"></div>

         <label for="password">Password</label>
         <input type="password" id="password" autocomplete="current-password">
       </div>
       
       <button type="submit" class="btn-primary">Sign in</button>
       
       <a href="#" class="forgot-password">Forgot password or username?</a>
