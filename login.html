<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Hanken Grotesk for authentic Roblox typography -->
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Your CSS from GitHub -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('https://i.imgur.com/FjfCRUg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .page {
            background-image: url('https://i.imgur.com/FjfCRUg.png') !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .page a { text-decoration: none; color: inherit; }

        .top-nav {
            position: relative;
            z-index: 2;
            height: 52px;
            background: #232527;
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 0 16px;
        }

        .roblox-logo {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .roblox-logo svg {
            height: 22px;
            width: 22px;
            fill: #ffffff;
            transition: opacity 0.15s ease;
        }

        .roblox-logo:hover svg {
            opacity: 0.85;
        }

        .nav-links { display: flex; align-items: center; gap: 44px; }

        .nav-link { font-size: 16px; font-weight: 600; color: #fff; }
        .nav-link:hover { opacity: 0.85; }

        .nav-right { margin-left: auto; display: flex; align-items: center; gap: 20px; }

        .btn-signup {
            margin-left: auto;
            background: #3b74f2;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }

        .btn-signup:hover { background: #3266dd; }

        .auth-wrap {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .auth-card {
            background: rgba(35, 37, 39, 0.85);
            backdrop-filter: blur(5px);
            width: 456px;
            max-width: 100%;
            padding: 34px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 22px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auth-card h1 {
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
        }

        .auth-card input[type="text"],
        .auth-card input[type="password"] {
            width: 100%;
            height: 48px;
            background: #1b1c1e;
            border: 1px solid #3b3d40;
            border-radius: 6px;
            padding: 0 16px;
            font-size: 16px;
            color: #fff;
            outline: none;
            font-family: inherit;
            margin-bottom: 12px;
        }

        .auth-card input::placeholder { color: #e6e7e8; opacity: 1; }
        .auth-card input:focus { border-color: #7d8085; }
        .auth-card input:user-invalid { border-color: #d33a3a; }

        .submit {
            width: 100%;
            height: 44px;
            background: #1b1c1e;
            border: 1px solid #4a4d51;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 4px;
        }

        .submit:hover { background: #26282b; border-color: #6a6d72; }

        .forgot {
            display: block;
            text-align: center;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            margin: 24px 0 26px;
        }

        .forgot:hover { text-decoration: underline; }

        .opt-btn {
            display: block;
            width: 100%;
            background: #2c2e31;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            font-family: inherit;
            text-align: center;
        }

        .opt-btn:hover { background: #36383c; }

        .signup-row {
            text-align: center;
            font-size: 15px;
            color: #fff;
            margin-top: 24px;
            font-weight: 500;
        }

        .signup-row a { font-weight: 700; }
        .signup-row a:hover { text-decoration: underline; }

        .status {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            min-height: 18px;
            margin-top: 10px;
        }

        .status.ok { color: #5ee089; }
        .status.err { color: #ff7a70; }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid #7db0ff;
            outline-offset: 2px;
        }

        @media (max-width: 780px) {
            .nav-links { display: none; }
            .auth-card { padding: 24px; }
            .auth-card h1 { font-size: 25px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Navigation Bar -->
        <nav class="top-nav">
            <a href="#" class="roblox-logo">
                <!-- Simple SVG placeholder for Roblox Logo -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18l7 3.5v7.64l-7 3.5-7-3.5V7.68l7-3.5z"/>
                </svg>
            </a>
            <div class="nav-links">
                <a href="#" class="nav-link">Discover</a>
                <a href="#" class="nav-link">Marketplace</a>
                <a href="#" class="nav-link">Create</a>
                <a href="#" class="nav-link">Robux</a>
            </div>
            <div class="nav-right">
                <button class="btn-signup">Sign Up</button>
            </div>
        </nav>

        <!-- Login Card -->
        <div class="auth-wrap">
            <div class="auth-card">
                <h1>Login</h1>
                <form id="loginForm">
                    <input type="text" name="username" placeholder="Username" required autocomplete="username">
                    <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
                    
                    <button type="submit" class="submit">Log In</button>
                    
                    <a href="#" class="forgot">Forgot Password?</a>
                    
                    <button type="button" class="opt-btn">Continue with Google</button>
                    <button type="button" class="opt-btn">Continue with Apple</button>
                    
                    <div class="status" id="statusMsg"></div>
                </form>
                
                <div class="signup-row">
                    Don't have an account? <a href="#">Sign Up</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple script to handle form submission visually
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const status = document.getElementById('statusMsg');
            const btn = document.querySelector('.submit');
            
            btn.textContent = 'Logging in...';
            btn.disabled = true;
            
            setTimeout(() => {
                status.textContent = 'Logged in successfully!';
                status.className = 'status ok';
                btn.textContent = 'Log In';
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body>
</html>
